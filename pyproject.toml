[project]
name = "cloud-ops-team"
version = "0.3.0"
description = "Autonomous cloud operations team (error watch, security audit, PR verification) built with Google ADK"
authors = [
    {name = "Atsuki Sakai"},
]
license = "Apache-2.0"
readme = "README.md"


dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.9.2,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.14.0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.9.2,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<3.0.0"
]
# Browser scenarios (runner "browser"). After installing, run
# `uv run playwright install --with-deps chromium`.
browser = [
    "playwright>=1.49.0,<2.0.0",
]
# Exact pins: a linter upgrade changes which code the edit hook rejects, so it
# must land in its own PR together with the cleanup it requires
# (docs/code-quality.md).
lint = [
    "ruff==0.17.6",
    "ty==0.0.107",
    "ast-grep-cli==0.44.1",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# The edit hook passes explicit paths; keep excludes authoritative for them too.
force-exclude = true

# Single source of truth for Python rules: CI, `make lint` and the Claude Code
# edit hook (scripts/quality/hook.py) all read this table. Rationale and fix
# guidance per family live in docs/code-quality.md and
# .claude/skills/python-quality/SKILL.md.
[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear (B904: re-raise with `from`)
    "UP",    # pyupgrade
    "RUF",   # ruff specific rules
    "S",     # flake8-bandit: security
    "BLE",   # blind `except Exception`
    "TRY",   # exception handling style
    "ANN",   # mandatory type annotations
    "ASYNC", # blocking calls inside async code
    "PERF",  # avoidable slow loops
    "SIM",   # simplifications
    "RET",   # return consistency
    "PTH",   # pathlib over os.path
    "TID",   # banned imports
    "DTZ",   # timezone-aware datetimes
    "G",     # logging format
    "LOG",   # logging misuse
    "T20",   # print
    "PIE",   # misc pitfalls
    "PGH",   # blanket noqa / type: ignore
    "FURB",  # modern idioms
    "FBT001", "FBT002", # boolean positional parameters
    "ERA",   # commented-out code
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]
ignore = [
    "E501",    # line length is the formatter's job
    "C901",    # complexity is reviewed by humans
    "RUF001", "RUF002", "RUF003", # fullwidth punctuation in Japanese strings
    "TRY003",  # messages at the raise site are the project style
    "TRY301",  # raising inside try to reuse one handler is intentional
    "ANN401",  # ADK payloads are dynamic; ty checks the rest
    "N818",    # exception class names are part of the public surface
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "S108", "S603", "S607", "S310", # asserts and fixtures
    "ANN", "FBT", "PLW", "T20", "TRY", "BLE001", "ARG", "TID251",
    "PERF", "ASYNC", # test loops and temp-file checks are not production paths
]
"scripts/**" = ["T201", "S603", "S607", "ANN", "BLE001", "FBT"]
# Frozen formula: fingerprints de-duplicate open issues (golden tests).
"app/core/fingerprint.py" = ["S324", "FURB167"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use httpx with an explicit timeout (project HTTP client)."

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.analysis]
# Optional "browser" extra (playwright) is not installed in the lint environment.
allowed-unresolved-imports = ["playwright.**"]

[tool.ty.rules]
# Strict for app/: every rule keeps its default (error) level, deprecations too.
deprecated = "error"

# Tests and scripts build fakes and parse loose JSON; keep them on the
# third-party-tolerant profile so the strict profile stays meaningful for app/.
[[tool.ty.overrides]]
include = ["tests/**", "scripts/**"]

[tool.ty.overrides.rules]
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-explicit-return = "ignore"
missing-union-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json,./artifacts,./.google-agents-cli"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


