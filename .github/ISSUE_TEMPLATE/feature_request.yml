name: Feature request
description: Suggest a new check, tool, job or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operations work should the team do (better)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which specialist, which data source, what should end up in the issue or report?
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The feature only needs read access to the cloud (the agents never change resources)
          required: true
